# Bulwark starter rules for C#. Apache-2.0. Severity: ERROR=high, WARNING=medium, INFO=low.
rules:
  - id: bulwark.csharp.sql-injection-concat
    languages: [csharp]
    severity: ERROR
    message: SQL built by string concatenation or interpolation and passed to a command. Use parameters (SqlParameter / AddWithValue) instead.
    metadata: { cwe: "CWE-89", category: security }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: new $CMD($A + $B, ...)
              - pattern: new $CMD($"...", ...)
          - metavariable-regex:
              metavariable: $CMD
              regex: ^(SqlCommand|NpgsqlCommand|MySqlCommand|SqliteCommand|OracleCommand)$
      - pattern: $X.CommandText = $A + $B
      - pattern: $X.CommandText = $"..."
      - patterns:
          - pattern-either:
              - pattern: $DB.$EXEC($A + $B, ...)
              - pattern: $DB.$EXEC($"...", ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(FromSqlRaw|ExecuteSqlRaw|ExecuteSqlRawAsync|Query|QueryAsync|Execute|ExecuteAsync)$

  - id: bulwark.csharp.insecure-deserialization
    languages: [csharp]
    severity: ERROR
    message: BinaryFormatter and similar serializers allow remote code execution on untrusted data. Use System.Text.Json.
    metadata: { cwe: "CWE-502", category: security }
    pattern-either:
      - pattern: new BinaryFormatter()
      - pattern: new NetDataContractSerializer(...)
      - pattern: new LosFormatter(...)
      - pattern: new SoapFormatter()

  - id: bulwark.csharp.tls-validation-disabled
    languages: [csharp]
    severity: ERROR
    message: Certificate validation is disabled, which allows man-in-the-middle attacks.
    metadata: { cwe: "CWE-295", category: security }
    pattern-either:
      - pattern: ServicePointManager.ServerCertificateValidationCallback = (...) => true
      - pattern: $H.ServerCertificateCustomValidationCallback = (...) => true
      - pattern: $H.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator

  - id: bulwark.csharp.weak-hash
    languages: [csharp]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security purposes. Use SHA-256 or better.
    metadata: { cwe: "CWE-328", category: security }
    pattern-either:
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern: MD5.HashData(...)
      - pattern: SHA1.HashData(...)
      - pattern: new MD5CryptoServiceProvider()
      - pattern: new SHA1CryptoServiceProvider()

  - id: bulwark.csharp.process-start-concat
    languages: [csharp]
    severity: WARNING
    message: Process started with a concatenated or interpolated command line. Validate input and pass arguments through ArgumentList.
    metadata: { cwe: "CWE-78", category: security }
    pattern-either:
      - pattern: Process.Start($A + $B, ...)
      - pattern: Process.Start($"...", ...)
      - pattern: Process.Start($F, $A + $B)
      - pattern: Process.Start($F, $"...")
