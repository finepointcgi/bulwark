# Bulwark starter rules for PHP. Apache-2.0.
rules:
  - id: bulwark.php.eval
    languages: [php]
    severity: ERROR
    message: eval runs arbitrary code.
    metadata: { cwe: "CWE-95", category: security }
    pattern: eval($X);

  - id: bulwark.php.weak-hash
    languages: [php]
    severity: WARNING
    message: md5/sha1 are not suitable for passwords or integrity. Use password_hash() or hash('sha256', ...).
    metadata: { cwe: "CWE-328", category: security }
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)

  - id: bulwark.php.unserialize
    languages: [php]
    severity: ERROR
    message: unserialize on untrusted data enables object injection. Use json_decode.
    metadata: { cwe: "CWE-502", category: security }
    pattern: unserialize($X, ...)

  - id: bulwark.php.command-exec
    languages: [php]
    severity: ERROR
    message: Shell command with a dynamic string. Use escapeshellarg() or avoid the shell.
    metadata: { cwe: "CWE-78", category: security }
    patterns:
      - pattern-either:
          - pattern: system($X, ...);
          - pattern: shell_exec($X);
          - pattern: passthru($X, ...);
          - pattern: exec($X, ...);
      - pattern-not: system("...", ...);
      - pattern-not: shell_exec("...");

  - id: bulwark.php.tls-verification-disabled
    languages: [php]
    severity: ERROR
    message: TLS verification is disabled for this request.
    metadata: { cwe: "CWE-295", category: security }
    pattern-either:
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false);
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYHOST, 0);
