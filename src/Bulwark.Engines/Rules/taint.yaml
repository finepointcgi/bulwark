# Bulwark taint rules (Apache-2.0): track untrusted request data to dangerous sinks.
# A hit here means a real data flow from user input, so these are higher confidence than the
# pattern rules in the per-language files.
rules:
  # ---------- Python (Flask / Django) ----------
  - id: bulwark.taint.python.injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: User input reaches a command, SQL query or eval without sanitization. Use parameters / argument lists, never string building.
    metadata: { cwe: "CWE-74", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.$ATTR.get(...)
          - pattern: request.$ATTR[...]
          - pattern: request.get_json(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: os.system($Q)
              - pattern: os.popen($Q, ...)
              - pattern: subprocess.$F($Q, ..., shell=True, ...)
              - pattern: eval($Q)
              - pattern: exec($Q)
          - focus-metavariable: $Q

  - id: bulwark.taint.python.path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: User input is used as a file path. Resolve it and check it stays inside the allowed folder (or use send_from_directory).
    metadata: { cwe: "CWE-22", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: request.$ATTR.get(...)
          - pattern: request.$ATTR[...]
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: send_file($P, ...)
          - focus-metavariable: $P

  # ---------- JavaScript / TypeScript (Express, Node) ----------
  - id: bulwark.taint.js.injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data reaches a shell command, SQL query or eval. Use execFile with an argument array and parameterized queries.
    metadata: { cwe: "CWE-74", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.headers
          - pattern: $REQ.cookies
    pattern-sanitizers:
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($Q, ...)
              - pattern: $CP.execSync($Q, ...)
              - pattern: exec($Q, ...)
              - pattern: execSync($Q, ...)
              - pattern: eval($Q)
              - pattern: new Function($Q)
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.raw($Q, ...)
          - focus-metavariable: $Q

  - id: bulwark.taint.js.xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data is written into an HTML response. Escape it or use a template engine with auto-escaping.
    metadata: { cwe: "CWE-79", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sanitizers:
      - pattern-either:
          - pattern: escape(...)
          - pattern: escapeHtml(...)
          - pattern: DOMPurify.sanitize(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X)
          - focus-metavariable: $X

  - id: bulwark.taint.js.path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data is used as a file path. Resolve it and check it stays inside the allowed folder.
    metadata: { cwe: "CWE-22", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sanitizers:
      - pattern: path.basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.$READ($P, ...)
              - pattern: $RES.sendFile($P, ...)
          - focus-metavariable: $P

  # ---------- C# (ASP.NET Core) ----------
  - id: bulwark.taint.csharp.injection
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: Request data reaches a SQL command or process start. Use SqlParameter and ProcessStartInfo.ArgumentList.
    metadata: { cwe: "CWE-74", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query[...]
          - pattern: Request.Form[...]
          - pattern: Request.Headers[...]
          - pattern: Request.Cookies[...]
          - pattern: HttpContext.Request.Query[...]
    pattern-sanitizers:
      - pattern-either:
          - pattern: int.Parse(...)
          - pattern: Guid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new SqlCommand($Q, ...)
              - pattern: $C.CommandText = $Q
              - pattern: $DB.FromSqlRaw($Q, ...)
              - pattern: $DB.ExecuteSqlRaw($Q, ...)
              - pattern: Process.Start($Q, ...)
          - focus-metavariable: $Q

  # ---------- Java (Servlets / Spring) ----------
  - id: bulwark.taint.java.injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: Request data reaches a SQL statement or command. Use PreparedStatement and ProcessBuilder with separate arguments.
    metadata: { cwe: "CWE-74", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($Q)
              - pattern: $S.executeUpdate($Q)
              - pattern: $S.execute($Q)
              - pattern: Runtime.getRuntime().exec($Q, ...)
          - focus-metavariable: $Q

  # ---------- Go (net/http) ----------
  - id: bulwark.taint.go.injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: Request data reaches a SQL query or shell command. Use query parameters and exec.Command with separate arguments.
    metadata: { cwe: "CWE-74", category: security, confidence: high }
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: $R.Header.Get(...)
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($Q, ...)
              - pattern: $DB.QueryRow($Q, ...)
              - pattern: $DB.Exec($Q, ...)
              - pattern: exec.Command("sh", "-c", $Q)
              - pattern: exec.Command("bash", "-c", $Q)
          - focus-metavariable: $Q
