# Bulwark starter rules for C and C++ (Apache-2.0). cppcheck finds memory-safety defects;
# these catch dangerous APIs it does not report.
rules:
  - id: bulwark.c.unbounded-copy
    languages: [c, cpp]
    severity: ERROR
    message: Unbounded string copy can overflow the destination buffer. Use snprintf, strlcpy or a length-checked copy.
    metadata: { cwe: "CWE-120", category: security }
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
      - pattern: gets(...)

  - id: bulwark.c.format-string
    languages: [c, cpp]
    severity: ERROR
    message: Non-constant format string. An attacker-controlled format string can read and write memory; use printf("%s", value).
    metadata: { cwe: "CWE-134", category: security }
    patterns:
      - pattern-either:
          - pattern: printf($FMT)
          - pattern: fprintf($F, $FMT)
          - pattern: syslog($P, $FMT)
      - pattern-not: printf("...")
      - pattern-not: fprintf($F, "...")
      - pattern-not: syslog($P, "...")

  - id: bulwark.c.command-injection
    languages: [c, cpp]
    severity: ERROR
    message: Shell command built at run time. Use execv/posix_spawn with an argument array.
    metadata: { cwe: "CWE-78", category: security }
    patterns:
      - pattern-either:
          - pattern: system($CMD)
          - pattern: popen($CMD, ...)
      - pattern-not: system("...")
      - pattern-not: popen("...", ...)

  - id: bulwark.c.insecure-random
    languages: [c, cpp]
    severity: WARNING
    message: rand()/random() are predictable. Use a CSPRNG (getrandom, arc4random, BCryptGenRandom) for keys, tokens and nonces.
    metadata: { cwe: "CWE-338", category: security }
    pattern-either:
      - pattern: rand()
      - pattern: random()
