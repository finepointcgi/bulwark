# Nightjar for GitLab CI. Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/OWNER/REPO/main/ci/gitlab/nightjar.gitlab-ci.yml
#
# Results show in the merge request widget and diff (code quality report), the job summary
# artifact (nightjar.md), and SARIF for other tools. On merge requests only new findings fail
# the job. Engines run as containers, so the job uses Docker-in-Docker.

variables:
  NIGHTJAR_FAIL_ON: high
  NIGHTJAR_PATH: "."
  NIGHTJAR_ARGS: ""
  NIGHTJAR_REPO: OWNER/REPO

nightjar:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: 0
    NIGHTJAR_HOME: $CI_PROJECT_DIR/.nightjar-home
  before_script:
    - apk add --no-cache curl git bash gcompat libstdc++ icu-libs >/dev/null
    - NIGHTJAR_INSTALL_DIR=/usr/local/bin sh -c "$(curl -fsSL https://raw.githubusercontent.com/$NIGHTJAR_REPO/main/scripts/install.sh)"
  script:
    - |
      since=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        since="--since $CI_MERGE_REQUEST_DIFF_BASE_SHA --history $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
      fi
      nightjar scan "$NIGHTJAR_PATH" --container --fail-on "$NIGHTJAR_FAIL_ON" $since \
        --sarif-output nightjar.sarif --summary-output nightjar.md --codeclimate-output gl-code-quality.json $NIGHTJAR_ARGS
  artifacts:
    when: always
    paths: [nightjar.sarif, nightjar.md]
    reports:
      codequality: gl-code-quality.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
