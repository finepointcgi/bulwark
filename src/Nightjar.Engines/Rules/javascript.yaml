# Nightjar starter rules for JavaScript and TypeScript. Apache-2.0.
rules:
  - id: nightjar.js.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval / new Function run arbitrary code. Never pass anything derived from input.
    metadata: { cwe: "CWE-95", category: security }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: nightjar.js.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell command built from a dynamic string. Use execFile/spawn with an argument array.
    metadata: { cwe: "CWE-78", category: security }
    pattern-either:
      - pattern: $CP.exec($A + $B, ...)
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync($A + $B, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: exec($A + $B, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync($A + $B, ...)
      - pattern: execSync(`...${$X}...`, ...)

  - id: nightjar.js.sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL query built from a dynamic string. Use parameterized queries.
    metadata: { cwe: "CWE-89", category: security }
    pattern-either:
      - pattern: $DB.query($A + $B, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.execute($A + $B, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern: $DB.raw($A + $B, ...)
      - pattern: $DB.raw(`...${$X}...`, ...)

  - id: nightjar.js.dom-xss
    languages: [javascript, typescript]
    severity: WARNING
    message: Assigning dynamic HTML can lead to XSS. Use textContent or sanitize first.
    metadata: { cwe: "CWE-79", category: security }
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: document.write("...")

  - id: nightjar.js.tls-validation-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate validation is disabled.
    metadata: { cwe: "CWE-295", category: security }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: nightjar.js.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security purposes. Use SHA-256 or better.
    metadata: { cwe: "CWE-328", category: security }
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
